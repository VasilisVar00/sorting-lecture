<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithms Talk</title>
    <style>
        :root {
            --primary-color: #2563eb; /* Modern Blue */
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #64748b;
        }

        section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        /* Video Responsive Wrapper */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .video-wrapper video, .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* PDF Embed Wrapper */
        .pdf-wrapper {
            width: 100%;
            height: 500px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 50px;
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .pdf-wrapper { height: 350px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <h1>Sorting Algorithms</h1>
            <p class="subtitle">Presented by Vasilis Varsamis | Date: December 5th 2025</p>
        </header>

        <section>
            <h2>Watch the Talk</h2>
            <p>A quick overview of Bubble, Merge, and Quick sort strategies.</p>
            
            <div class="video-wrapper">
                <video controls>
                    <source src="talk-video.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                </div>
        </section>

        <section>
            <h2>Presentation Slides</h2>
            <p>Follow along or download the reference material.</p>
            
            <a href="slides.pdf" class="btn" download>Download PDF Slides</a>

            <iframe class="pdf-wrapper" src="slides.pdf">
            </iframe>
        </section>

        <footer>
            <p>Check out the code on <a href="https://github.com/yourusername">GitHub</a></p>
        </footer>

    </div>

</body>
</html>
